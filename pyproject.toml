[project]
name = "gupi"
version = "0.0.1"
description = "GUPI (Generalised Unitary Perceptive Integrator): a semantic memory and context engine on TypeDB 3"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "typedb-driver==3.14.0",
]

[project.optional-dependencies]
# Real LLM extraction with Anthropic Claude. Not needed for the offline default.
claude = ["anthropic>=2.4.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gupi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: needs a running TypeDB server (docker compose up -d)"]
filterwarnings = ["ignore::SyntaxWarning"]
